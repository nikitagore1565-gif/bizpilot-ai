ard p{margin:0 0 15px;color:var(--muted);font-size:12px;min-height:35px}.feature-foot{display:flex;align-items:center;justify-content:space-between}.switch{width:38px;height:21px;border-radius:30px;background:#d9deea;position:relative;border:0}.switch:after{content:'';position:absolute;width:15px;height:15px;top:3px;left:3px;border-radius:50%;background:white;transition:.2s}.switch.on{background:#5c70e9}.switch.on:after{left:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:11px;font-weight:700;color:#58647a;margin-bottom:6px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #e1e6ef;background:#fff;border-radius:9px;padding:10px 11px;outline:none;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#8d9aff;box-shadow:0 0 0 3px #eef0ff}.full{grid-column:1/-1}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.search{max-width:280px}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;color:#647087;font-size:11px}.pill.active{background:var(--blue2);color:var(--blue);border-color:#dfe3ff}.empty{padding:30px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}.template-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.template{border:1px solid var(--line);border-radius:12px;padding:14px;background:white}.template h4{margin:0 0 5px;font-size:13px}.template p{margin:0 0 12px;color:var(--muted);font-size:11px}.template .btn{width:100%}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.step{padding:8px 12px;border-radius:8px;background:#f3f5fa;color:#748097;font-size:11px}.step.current{background:var(--blue2);color:var(--blue);font-weight:800}.notice{background:#f5f7ff;border:1px solid #e4e8ff;border-radius:10px;padding:12px;color:#59678a;f <script>

let current='overview';
function header(kicker,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function stat(label,num,delta,ico){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><div class="stat-num">${num}</div><div class="delta">${delta}</div></div>`}
function tableLeads(){return `<div class="table-wrap"><table><thead><tr><th>Contact</th><th>Business</th><th>Source</th><th>Status</th><th>Last activity</th></tr></thead><tbody>${leads.map((l,i)=>`<tr><td><div class="person"><div class="mini-avatar">${l[4]}</div><div><b>${l[0]}</b><small>${l[1]}</small></div></div></td><td>${l[2]}</td><td>${['Website form','Manual entry','Landing page','Import','Referral'][i]}</td><td><span class="badge ${l[3]==='New'?'blue':l[3]==='Contacted'?'orange':''}">${l[3]}</span></td><td>${['2 min ago','1 hour ago','Yesterday','Yesterday','2 days ago'][i]}</td></tr>`).join('')}</tbody></table></div>`}
function render(){let c=document.getElementById('content'),html='';document.getElementById('crumb').textContent=({overview:'Overview',ai:'AI Automation',leads:'Lead Generation',crm:'CRM',followups:'Customer Follow-up',appointments:'Appointments',templates:'Business Templates',analytics:'Analytics',settings:'Settings',billing:'Subscription'}[current]);

if(current==='ai') html=header('SMART WORKFLOWS','AI Automation','Build workflows that handle repetitive tasks while you stay in control.','<button class="btn" onclick="toast(\'Automation builder opened in demo mode\')">＋ New automation</button>')+`<div class="notice">Demo preview: switches and buttons show the intended interface. Live AI actions require backend connections, permissions and testing.</div><div class="grid feature-grid">${[['✦','AI Inquiry Assistant','Drafts helpful replies to incoming business enquiries.','Active','on'],['＋','New Lead Welcome','Sends a welcome message when a lead is captured.','Active','on'],['◷','Lead Qualification','Collects key details and labels lead intent.','Paused','off'],['↗','Missed Enquiry Recovery','Creates a follow-up task for unanswered enquiries.','Active','on'],['▣','Appointment Reminder','Prepares reminders before scheduled appointments.','Active','on'],['✉','Review Request','Requests feedback after a completed service.','Paused','off']].map((x,i)=>`<div class="card feature-card"><div class="feature-ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><div class="feature-foot"><span class="badge ${x[3]==='Paused'?'orange':''}">${x[3]}</span><button class="switch ${x[4]}" onclick="this.classList.toggle('on');toast('Demo setting updated')" aria-label="Toggle automation"></button></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="card-title"><h3>Automation activity</h3><span>Recent runs</span></div>${tableLeads()}</div>`;
if(current==='leads') html=header('GROW YOUR PIPELINE','Lead Generation','Capture and organize prospects from connected channels.','<button class="btn" onclick="toast(\'Lead capture form created in demo\')">＋ Add lead source</button>')+`<div class="grid stats">${stat('Captured this month','248','↑ 16.4% this month','◎')}${stat('Conversion rate','8.6%','↑ 1.2% this month','↗')}${stat('Sources connected','4','Website, forms, CSV, referral','⌁')}${stat('Needs review','19','Review before outreach','!')}</div><div class="notice">Lead generation uses sources you connect or provide. No guaranteed lead volume; outreach must follow consent, privacy laws and each platform’s terms.</div><div class="card"><div class="card-title"><h3>Lead sources</h3><span>Manage connected channels</span></div>${[['Website contact form','Collect enquiries directly from your site','Connected'],['Landing pages','Campaign-specific lead capture pages','Connected'],['CSV import','Bring in contacts you are authorized to use','Available'],['Partner referrals','Track leads referred by partners','Connected']].map(x=>`<div class="activity"><i class="dot" style="background:#18a47b"></i><div style="flex:1"><b>${x[0]}</b><p>${x[1]}</p></div><span class="badge">${x[2]}</span><button class="btn secondary sm" onclick="toast('Source settings opened')">Configure</button></div>`).join('')}</div>`;

function wireNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function go(p){current=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');window.scrollTo(0,0)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function filterRows(q){document.querySelectorAll('#crmTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
function filterTemplates(){let search=(document.getElementById('templateSearch')?.value||'').trim().toLowerCase();let group=document.getElementById('templateCategory')?.value||'';document.querySelectorAll('.template').forEach(x=>{let matchesName=!search||x.dataset.name.includes(search);let matchesGroup=!group||x.dataset.group===group;x.style.display=matchesName&&matchesGroup?'':'none'})}
function getTemplateDetails(name){
 const n=name.toLowerCase();
 let fields=['Contact name','Email address','Phone number','Lead source','Lead status','Last interaction','Notes'];
 let stages=['New enquiry','Contacted','Qualified','Converted','Not interested'];
 let automations=['Send enquiry acknowledgement','Create CRM contact','Assign follow-up task','Send appointment reminder'];
 let messages=['Thanks for contacting us. Our team will get back to you shortly.','Your appointment is coming up. Please confirm or request a new time.'];
 if(/salon|spa|barber|nail|massage|makeup|tattoo|beauty|hair/.test(n)){fields=['Customer name','Email','Phone','Service requested','Preferred staff','Preferred date/time','Lead source','Customer status'];stages=['New enquiry','Consultation requested','Appointment booked','Service completed','Repeat customer'];automations=['New enquiry welcome','Appointment confirmation','24-hour appointment reminder','Post-service review request'];messages=['Thanks for reaching out! Which service would you like to book?','Thanks for visiting us. We would appreciate your feedback.'];}
 else if(/restaurant|cafe|bakery|catering|hotel|resort|venue/.test(n)){fields=['Guest name','Email','Phone','Party / guest count','Booking date','Booking type','Special request','Booking status'];stages=['New enquiry','Details received','Reservation confirmed','Visited / served','Repeat guest'];automations=['New reservation acknowledgement','Booking confirmation','Pre-visit reminder','Post-visit feedback request'];messages=['Thanks for your enquiry. Please share your preferred date and party size.','Your reservation request has been received. We will confirm availability.'];}
 else if(/roofing|hvac|plumbing|electrical|cleaning|pest|landscap|painting|renovation|moving/.test(n)){fields=['Customer name','Email','Phone','Service address','Job type','Preferred visit date','Estimate status','Lead source'];stages=['New request','Site visit required','Estimate sent','Job scheduled','Job completed'];automations=['New service request acknowledgement','Site-visit scheduling task','Estimate follow-up','Job completion review request'];messages=['Thanks for requesting a quote. Please share the service address and a suitable time.','We are checking in on the estimate we sent. Would you like to discuss it?'];}
 else if(/real estate|property|rental|mortgage/.test(n)){fields=['Lead name','Email','Phone','Preferred location','Budget range','Property type','Buying / renting timeline','Lead status'];stages=['New lead','Requirement captured','Viewing scheduled','Offer / application','Closed'];automations=['New property enquiry response','Viewing confirmation','Viewing reminder','Inactive lead follow-up'];}
 else if(/dental|medical|hospital|clinic|physio|chiropr|dermatology|eye|veterinary|mental wellness/.test(n)){fields=['Patient / client name','Contact details','Enquiry type (non-clinical)','Preferred appointment time','Lead source','Consent status','Appointment status'];stages=['New enquiry','Contacted','Appointment requested','Appointment confirmed','Visit completed'];automations=['Enquiry acknowledgement','Appointment confirmation','Appointment reminder','Post-visit administrative follow-up'];messages=['Thank you for contacting the practice. Our team will help with appointment availability.','This is an appointment reminder. Please contact the practice if you need to reschedule.'];}
 return {fields,stages,automations,messages};
}
function selectTemplate(name){
 const d=getTemplateDetails(name);
 const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 document.getElementById('templateModalBody').innerHTML=`<div class="modal-head"><div><div class="eyebrow">BUSINESS TEMPLATE PREVIEW</div><h2 id="templateModalTitle">${esc(name)}</h2><p class="sub">Preview the starter configuration before applying it to this workspace.</p></div><button class="btn secondary sm" onclick="closeTemplatePreview()">✕ Close</button></div><div class="notice">This is a starter configuration preview. Messaging and automations will not run until real integrations, consent rules and backend workflows are configured.</div><div class="grid two-col"><div class="modal-section"><h3>CRM fields</h3><ul>${d.fields.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="modal-section"><h3>Lead stages</h3><ul>${d.stages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="modal-section"><h3>Suggested automations</h3><ul>${d.automations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="modal-section"><h3>Message template examples</h3><ul>${d.messages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="modal-actions"><button class="btn secondary" onclick="closeTemplatePreview()">Cancel</button><button class="btn" onclick="applyTemplate('${esc(name)}')">Use this template</button></div>`;
 document.getElementById('templateModal').classList.add('show');
}
function closeTemplatePreview(){document.getElementById('templateModal').classList.remove('show')}
function applyTemplate(name){localStorage.setItem('bizpilot_selected_template',name);document.querySelectorAll('.template').forEach(card=>card.classList.toggle('template-selected',card.dataset.name===name.toLowerCase()));const sel=document.querySelector('select[aria-label="Business category"]');if(sel)sel.value=name;closeTemplatePreview();toast(name+' template selected for this demo workspace');}

</script></body></html>
