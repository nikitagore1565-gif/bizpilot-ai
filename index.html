<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BizPilot AI — Business Operating System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--ink:#182238;--muted:#758198;--line:#e6ebf3;--blue:#5267e8;--nav:#111a30;--green:#159b72;--red:#c34c5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#eef1ff,#f8f9fc)}.authbox{width:min(420px,100%);background:#fff;padding:28px;border:1px solid var(--line);border-radius:17px;box-shadow:0 15px 45px #1c2c5514}.logo{font-size:21px;font-weight:850;letter-spacing:-.5px}.logo span{color:var(--blue)}.authbox h1{margin:22px 0 4px;font-size:25px}.muted{color:var(--muted)}.authbox input,.field input,.field select,.field textarea,.filter{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.authbox input{margin:7px 0}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}.btn.light{background:#eef0ff;color:var(--blue)}.btn.ghost{background:#fff;color:#526078;border:1px solid var(--line)}.btn.danger{background:#fff0f1;color:var(--red)}.authbox .btn{width:100%;margin-top:8px}.authmsg{min-height:22px;font-size:12px;color:var(--red);padding-top:6px}
.app{min-height:100vh;display:flex}.sidebar{width:248px;position:fixed;inset:0 auto 0 0;background:var(--nav);color:#dbe3f5;padding:19px 13px;display:flex;flex-direction:column;overflow:auto;z-index:10}.sidebar .logo{padding:7px 10px 23px;color:#fff}.sidebar .logo span{color:#9eabff}.navgroup{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#8290ad;padding:14px 10px 5px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#b8c4da;padding:10px 11px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#293754;color:#fff}.sidefoot{margin-top:auto;padding:13px 10px;color:#aebbd2;font-size:11px;border-top:1px solid #2b3650}.sidefoot button{margin-top:9px}.main{margin-left:248px;min-width:0;flex:1}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:4}.topright{display:flex;align-items:center;gap:12px}.content{padding:25px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:19px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:1.1px;color:var(--blue)}h1{font-size:26px;margin:4px 0}.desc{font-size:12px;color:var(--muted)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.two{grid-template-columns:1.3fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;min-width:0;box-shadow:0 5px 22px #1d2c4c08}.card h3{font-size:14px;margin:0 0 12px}.statlabel{font-size:12px;color:var(--muted)}.statnum{font-size:28px;font-weight:850;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.filter{max-width:290px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;color:var(--muted);text-transform:uppercase}.actions{display:flex;gap:5px}.actions button{padding:6px 8px;font-size:11px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef0ff;color:#4c5ed0;font-size:10px}.notice{padding:12px;border:1px solid #e2e7ff;background:#f4f6ff;border-radius:9px;color:#566486;font-size:12px;margin:10px 0}.success{background:#effaf6;border-color:#d5f1e6;color:#177a5c}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;font-size:11px;font-weight:750;margin-bottom:5px}.field textarea{min-height:80px;resize:vertical}.field.full{grid-column:1/-1}.templategrid{grid-template-columns:repeat(3,minmax(0,1fr))}.template{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}.template h4{margin:0 0 5px}.template p{font-size:11px;color:var(--muted);min-height:30px}.empty{padding:24px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#10182b88;z-index:60;display:grid;place-items:center;padding:15px}.modal{background:white;border-radius:14px;padding:20px;width:min(540px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h3{margin:0}.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#17233c;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 8px 24px #1115;max-width:min(420px,90vw)}.menu{display:none}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.templategrid,.three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.sidebar{transform:translateX(-260px);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu{display:inline-flex}.topbar{padding:0 13px}.content{padding:17px 12px}.pagehead{display:block}.pagehead>.btn{margin-top:10px}.templategrid,.three{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.topright .muted{display:none}}
</style>
</head>
<body>
<section id="auth"><div class="authbox"><div class="logo">BizPilot <span>AI</span></div><h1 id="authheading">Welcome back</h1><p class="muted">Sign in to manage your business workspace.</p><input id="auth-email" type="email" placeholder="Email address" autocomplete="email"><input id="auth-password" type="password" placeholder="Password (minimum 6 characters)" autocomplete="current-password"><button class="btn" id="login-btn">Sign in</button><button class="btn light" id="register-btn">Create account</button><div class="authmsg" id="auth-message"></div><p class="muted" style="font-size:10px">By continuing, use only customer data you are authorized to process.</p></div></section>
<div id="app" class="app hidden">
<aside class="sidebar" id="sidebar"><div class="logo">BizPilot <span>AI</span></div><nav class="nav">
<div class="navgroup">Workspace</div>
<button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button><button data-page="ai">✦ &nbsp; AI Automation</button><button data-page="leads">◎ &nbsp; Lead Generation</button><button data-page="crm">▤ &nbsp; CRM & Contacts</button><button data-page="followups">↗ &nbsp; Customer Follow-up</button><button data-page="appointments">▣ &nbsp; Appointments</button>
<div class="navgroup">Manage</div><button data-page="templates">▧ &nbsp; Business Templates</button><button data-page="analytics">◫ &nbsp; Analytics</button><button data-page="settings">⚙ &nbsp; Business Settings</button><button data-page="integrations">⌘ &nbsp; Integrations</button><button data-page="subscription">◇ &nbsp; Subscription</button>
</nav><div class="sidefoot"><div id="account-email"></div><div>Plan target: $49/month</div><button class="btn ghost" id="logout-btn">Sign out</button></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn ghost menu" id="menu-btn">☰</button><b id="page-title">Dashboard</b></div><div class="topright"><span class="muted" id="workspace-label">Workspace</span><span class="pill">BIZPILOT AI</span></div></header><section class="content" id="view"></section></main>
</div><div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
/* Public Supabase publishable key only. Never put service_role or provider secrets in this file. */
const SUPABASE_URL='https://worszytyjynwpsyizijc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_l-wakOZMrRtEGwarKmzqPA_FbgaBNk4';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const categories=['Dental Clinics','Medical Clinics','Hospitals','Physiotherapy Centers','Chiropractors','Dermatology Clinics','Eye Clinics','Veterinary Clinics','Mental Wellness Practices','Medical Spas','Hair Salons','Beauty Salons','Spas','Nail Salons','Barbershops','Massage Centers','Makeup Artists','Tattoo Studios','Roofing Companies','HVAC Companies','Plumbing Companies','Electrical Services','Cleaning Companies','Pest Control','Landscaping','Painting Contractors','Home Renovation','Moving Companies','Real Estate Agents','Real Estate Agencies','Property Management','Rental Agencies','Mortgage Brokers','Restaurants','Cafes','Bakeries','Catering Businesses','Hotels','Resorts','Event Venues','Law Firms','Accounting Firms','Tax Consultants','Insurance Agencies','Marketing Agencies','Digital Agencies','IT Service Providers','Business Consultants','Gyms','Personal Trainers','Yoga Studios','Dance Studios','Coaching Centers','Training Institutes','Online Tutors','Driving Schools','Car Dealerships','Auto Repair Shops','Car Washes','Auto Detailing','Tire Shops','Auto Rental','Clothing Stores','Furniture Stores','Electronics Stores','Jewelry Stores','Online Stores','Pet Shops','Photography Studios','Wedding Planners','Travel Agencies','Event Management','Printing Businesses','Security Companies','Recruitment Agencies'];
let currentUser=null,workspaceId=null,currentPage='dashboard',contacts=[],appointments=[],rules=[],sequences=[],businessSettings={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function errText(e){return e?.message||String(e||'Unknown error')}
async function query(table,fn){let q=supabaseClient.from(table).select('*').eq('workspace_id',workspaceId);return fn?fn(q):q}
async function ensureWorkspace(){
 let {data:memberRows,error}=await supabaseClient.from('workspace_members').select('workspace_id,role').eq('user_id',currentUser.id).limit(1);
 if(error)throw error;
 if(memberRows?.length){workspaceId=memberRows[0].workspace_id;}
 else{
  let {data:ws,error:we}=await supabaseClient.from('workspaces').insert({name:'My Workspace',owner_id:currentUser.id,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}).select('id').single();
  if(we)throw we;workspaceId=ws.id;
  let {error:me}=await supabaseClient.from('workspace_members').insert({workspace_id:workspaceId,user_id:currentUser.id,role:'owner'});if(me)throw me;
 }
 let {data:w}=await supabaseClient.from('workspaces').select('name').eq('id',workspaceId).maybeSingle();
 $('workspace-label').textContent=w?.name||'My Workspace';
}
async function loadAll(){
 const [c,a,r,s,b]=await Promise.all([
 query('contacts',q=>q.order('created_at',{ascending:false}).limit(500)),
 query('appointments',q=>q.order('starts_at',{ascending:true}).limit(500)),
 query('automation_rules',q=>q.order('created_at',{ascending:false}).limit(200)),
 query('followup_sequences',q=>q.order('created_at',{ascending:false}).limit(200)),
 supabaseClient.from('business_settings').select('*').eq('workspace_id',workspaceId).maybeSingle()
 ]);
 if(c.error)throw c.error;if(a.error)throw a.error;if(r.error)throw r.error;if(s.error)throw s.error;
 contacts=c.data||[];appointments=a.data||[];rules=r.data||[];sequences=s.data||[];businessSettings=b.data||{};
}
async function startSession(session){
 if(!session){currentUser=null;workspaceId=null;$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}
 currentUser=session.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('account-email').textContent=currentUser.email||'';
 try{await ensureWorkspace();await loadAll();render()}catch(e){notify('Workspace setup: '+errText(e));console.error(e)}
}
$('login-btn').onclick=async()=>{let email=$('auth-email').value.trim(),password=$('auth-password').value;$('auth-message').textContent='Signing in…';let {error}=await supabaseClient.auth.signInWithPassword({email,password});$('auth-message').textContent=error?errText(error):'Signed in.'};
$('register-btn').onclick=async()=>{let email=$('auth-email').value.trim(),password=$('auth-password').value;if(password.length<6){$('auth-message').textContent='Use a password with at least 6 characters.';return}$('auth-message').textContent='Creating account…';let {data,error}=await supabaseClient.auth.signUp({email,password});$('auth-message').textContent=error?errText(error):(data.session?'Account created.':'Account created. Check your email for confirmation, then sign in.')};
$('logout-btn').onclick=async()=>{let {error}=await supabaseClient.auth.signOut();if(error)notify(errText(error))};
supabaseClient.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>startSession(session),0)});
const titles={dashboard:'Dashboard',ai:'AI Automation',leads:'Lead Generation',crm:'CRM & Contacts',followups:'Customer Follow-up',appointments:'Appointments',templates:'Business Templates',analytics:'Analytics',settings:'Business Settings',integrations:'Integrations',subscription:'Subscription'};
function header(k,t,d,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="desc">${d}</div></div>${action}</div>`}
function stat(label,value,sub){return `<div class="card"><div class="statlabel">${label}</div><div class="statnum">${value}</div><div class="desc">${sub}</div></div>`}
function modal(title,body){$('modal-root').innerHTML=`<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="btn ghost" id="closemodal">✕</button></div>${body}</div></div>`;$('closemodal').onclick=closeModal;$('modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()}}
function closeModal(){$('modal-root').innerHTML=''}
function formField(label,id,value='',type='text',required=false){return `<div class="field"><label>${label}${required?' *':''}</label><input id="${id}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`}
async function saveRow(table,payload,id){let result=id?await supabaseClient.from(table).update(payload).eq('id',id).eq('workspace_id',workspaceId):await supabaseClient.from(table).insert({...payload,workspace_id:workspaceId});if(result.error)throw result.error;await loadAll();render();closeModal();notify('Saved successfully')}
async function deleteRow(table,id){if(!confirm('Delete this record?'))return;let {error}=await supabaseClient.from(table).delete().eq('id',id).eq('workspace_id',workspaceId);if(error){notify(errText(error));return}await loadAll();render();notify('Deleted')}
function render(){
 $('page-title').textContent=titles[currentPage];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
 const v=$('view');let h='';
 if(currentPage==='dashboard'){
  const upcoming=appointments.filter(a=>new Date(a.starts_at)>=new Date()).length;
  h=header('BUSINESS COMMAND CENTER','Welcome to BizPilot AI','A single workspace for leads, customer relationships and operations.')+
  `<div class="grid stats">${stat('Total contacts',contacts.length,'CRM records')}${stat('New leads',contacts.filter(c=>(c.lead_stage||'New').toLowerCase()==='new').length,'Contacts in New stage')}${stat('Upcoming appointments',upcoming,'Future scheduled appointments')}${stat('Active automations',rules.filter(r=>r.is_enabled).length,'Enabled automation rules')}</div>
  <div class="grid two"><div class="card"><h3>Recent contacts</h3>${contacts.slice(0,5).map(c=>`<p>${esc(c.full_name)} <span class="muted">· ${esc(c.lead_stage||'New')}</span></p>`).join('')||'<div class="empty">No contacts yet. Add your first contact in CRM.</div>'}</div><div class="card"><h3>Setup status</h3><div class="notice success">Authentication and workspace database are connected.</div><div class="notice">AI, email/SMS delivery, calendar sync and payments require secure provider/Edge Function setup before they can run live.</div></div></div>`;
 }
 if(currentPage==='crm'||currentPage==='leads'){
  let isLead=currentPage==='leads';
  h=header(isLead?'LEAD PIPELINE':'CUSTOMER RELATIONSHIPS',isLead?'Lead Management':'CRM & Contacts',isLead?'Capture and track leads in your workspace.':'Create, update and organize your customer records.',`<button class="btn" id="newcontact">＋ Add ${isLead?'lead':'contact'}</button>`)+
  `<div class="card"><div class="toolbar"><input class="filter" id="contactfilter" placeholder="Search name, email, company…"><select class="filter" id="stagefilter"><option value="">All stages</option>${['New','Contacted','Qualified','Proposal','Won','Lost'].map(s=>`<option>${s}</option>`).join('')}</select><button class="btn ghost" id="reload">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Source</th><th>Stage</th><th>Actions</th></tr></thead><tbody id="contactrows">${contacts.map(c=>contactRow(c)).join('')||'<tr><td colspan="7" class="empty">No records yet.</td></tr>'}</tbody></table></div></div>`;
 }
 if(currentPage==='appointments'){
  h=header('SCHEDULING','Appointments','Create and manage appointment records in your workspace.','<button class="btn" id="newappointment">＋ Add appointment</button>')+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Title</th><th>Contact</th><th>Start</th><th>End</th><th>Status</th><th>Actions</th></tr></thead><tbody>${appointments.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(contacts.find(c=>c.id===a.contact_id)?.full_name||'—')}</td><td>${esc(new Date(a.starts_at).toLocaleString())}</td><td>${esc(new Date(a.ends_at).toLocaleString())}</td><td>${esc(a.status)}</td><td><button class="btn ghost" data-editappt="${a.id}">Edit</button> <button class="btn danger" data-delappt="${a.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No appointments created yet.</td></tr>'}</tbody></table></div></div>`;
 }
 if(currentPage==='ai'){
  h=header('WORKFLOW ENGINE','AI Automation','Define rule records and enable/disable them. Execution requires a deployed secure Edge Function.','<button class="btn" id="newrule">＋ New rule</button>')+`<div class="notice">Rules are stored in Supabase. This page does not execute AI actions by itself. Add a server-side Edge Function and provider secrets before enabling live automation.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Trigger</th><th>Action</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rules.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.trigger_type)}</td><td>${esc(r.action_type)}</td><td>${r.is_enabled?'<span class="pill">Enabled</span>':'Disabled'}</td><td><button class="btn ghost" data-editrule="${r.id}">Edit</button> <button class="btn danger" data-delrule="${r.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No automation rules yet.</td></tr>'}</tbody></table></div></div>`;
 }
 if(currentPage==='followups'){
  h=header('CUSTOMER COMMUNICATION','Customer Follow-up','Create message sequence definitions. Sending requires a configured email/SMS provider and secure server function.','<button class="btn" id="newsequence">＋ New sequence</button>')+`<div class="notice">No email or SMS is sent from this frontend. Obtain customer consent and configure provider credentials in Supabase Edge Function secrets.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>Sequence</th><th>Channel</th><th>Steps</th><th>Status</th><th>Actions</th></tr></thead><tbody>${sequences.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.channel)}</td><td>${Array.isArray(s.steps)?s.steps.length:0}</td><td>${s.is_enabled?'Enabled':'Disabled'}</td><td><button class="btn ghost" data-editseq="${s.id}">Edit</button> <button class="btn danger" data-delseq="${s.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No follow-up sequences yet.</td></tr>'}</tbody></table></div></div>`;
 }
 if(currentPage==='templates'){
  h=header('BUSINESS STARTERS','75 Business Templates','Select a category to populate the business profile and customize workflows.')+`<div class="toolbar"><input class="filter" id="templatefilter" placeholder="Search 75 categories…"></div><div class="grid templategrid" id="templatecards">${categories.map((c,i)=>`<div class="template"><h4>${String(i+1).padStart(2,'0')} · ${esc(c)}</h4><p>Reusable setup starter for CRM fields, lead stages and workflow suggestions.</p><button class="btn light" data-template="${esc(c)}">Use template</button></div>`).join('')}</div>`;
 }
 if(currentPage==='analytics'){
  const byStage=['New','Contacted','Qualified','Proposal','Won','Lost'].map(s=>({s,n:contacts.filter(c=>(c.lead_stage||'New')===s).length}));
  h=header('WORKSPACE REPORTING','Analytics','Live counts from your saved CRM and appointment records.')+`<div class="grid stats">${stat('Contacts',contacts.length,'All CRM contacts')}${stat('Appointments',appointments.length,'All appointment records')}${stat('Won leads',byStage.find(x=>x.s==='Won').n,'Lead stage = Won')}${stat('Enabled rules',rules.filter(x=>x.is_enabled).length,'Active rule records')}</div><div class="card"><h3>Contacts by lead stage</h3>${byStage.map(x=>`<div style="display:flex;align-items:center;gap:12px;margin:12px 0"><span style="width:90px;font-size:12px">${x.s}</span><div style="height:9px;background:#edf0f7;border-radius:9px;flex:1;overflow:hidden"><div style="height:100%;width:${contacts.length?x.n/contacts.length*100:0}%;background:#5267e8"></div></div><b>${x.n}</b></div>`).join('')}</div>`;
 }
 if(currentPage==='settings'){
  let s=businessSettings;
  h=header('WORKSPACE PROFILE','Business Settings','Save your business profile and timezone.')+`<div class="card"><form id="settingsform"><div class="formgrid"><div class="field"><label>Business name</label><input id="businessname" value="${esc(s.business_name||'')}"></div><div class="field"><label>Website</label><input id="website" value="${esc(s.website||'')}" placeholder="https://"></div><div class="field"><label>Business category</label><select id="category"><option value="">Choose category</option>${categories.map(c=>`<option ${s.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Timezone</label><input id="timezone" value="${esc(s.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC')}"></div><div class="field full"><label>Description</label><textarea id="description">${esc(s.description||'')}</textarea></div></div><button class="btn" type="submit">Save business settings</button></form></div>`;
 }
 if(currentPage==='integrations'){
  h=header('CONNECTED SERVICES','Integrations','Connection registry for external providers. Add credentials only in secure server-side settings.')+`<div class="grid three">${[['AI provider','AI responses and automation','Requires Edge Function + provider secret'],['Email provider','Customer email follow-ups','Requires provider account + server secret'],['SMS / WhatsApp','Text reminders and follow-ups','Requires approved provider + consent'],['Calendar','Appointment availability and sync','Requires OAuth integration'],['Payments','$49/month subscription billing','Requires payment provider + webhook']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p><div class="notice">${x[2]}</div><span class="pill">Not connected</span></div>`).join('')}</div><div class="notice">This dashboard cannot create third-party credentials. Never paste secret keys into index.html or public GitHub.</div>`;
 }
 if(currentPage==='subscription'){
  h=header('BILLING','Subscription','Planned commercial plan. Checkout is not activated until payment provider setup and webhook testing.')+`<div class="card" style="max-width:520px"><div class="eyebrow">ONE PLAN</div><h1 style="font-size:38px">$49<span class="muted" style="font-size:14px"> / month</span></h1><p class="muted">BizPilot AI — proposed monthly subscription</p><ul><li>AI Automation</li><li>Lead and CRM Management</li><li>Customer Follow-up tools</li><li>Appointment management</li><li>75 business category templates</li><li>Analytics and workspace settings</li></ul><div class="notice">Payments are intentionally not active. Connect Stripe or another supported payment provider through a secure backend before accepting subscriptions.</div><button class="btn" disabled style="opacity:.55;cursor:not-allowed">Checkout not configured</button></div>`;
 }
 $('view').innerHTML=h;
 bindPageEvents();
}
function contactRow(c){return `<tr><td>${esc(c.full_name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${esc(c.company)}</td><td>${esc(c.lead_source)}</td><td>${esc(c.lead_stage||'New')}</td><td><div class="actions"><button class="btn ghost" data-editcontact="${c.id}">Edit</button><button class="btn danger" data-delcontact="${c.id}">Delete</button></div></td></tr>`}
function bindPageEvents(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;render();$('sidebar').classList.remove('open')});
 if($('newcontact'))$('newcontact').onclick=()=>contactModal();
 if($('reload'))$('reload').onclick=async()=>{try{await loadAll();render();notify('Data refreshed')}catch(e){notify(errText(e))}};
 if($('contactfilter'))$('contactfilter').oninput=filterContacts;
 if($('stagefilter'))$('stagefilter').onchange=filterContacts;
 document.querySelectorAll('[data-editcontact]').forEach(b=>b.onclick=()=>contactModal(contacts.find(x=>x.id===b.dataset.editcontact)));
 document.querySelectorAll('[data-delcontact]').forEach(b=>b.onclick=()=>deleteRow('contacts',b.dataset.delcontact));
 if($('newappointment'))$('newappointment').onclick=()=>appointmentModal();
 document.querySelectorAll('[data-editappt]').forEach(b=>b.onclick=()=>appointmentModal(appointments.find(x=>x.id===b.dataset.editappt)));
 document.querySelectorAll('[data-delappt]').forEach(b=>b.onclick=()=>deleteRow('appointments',b.dataset.delappt));
 if($('newrule'))$('newrule').onclick=()=>ruleModal();
 document.querySelectorAll('[data-editrule]').forEach(b=>b.onclick=()=>ruleModal(rules.find(x=>x.id===b.dataset.editrule)));
 document.querySelectorAll('[data-delrule]').forEach(b=>b.onclick=()=>deleteRow('automation_rules',b.dataset.delrule));
 if($('newsequence'))$('newsequence').onclick=()=>sequenceModal();
 document.querySelectorAll('[data-editseq]').forEach(b=>b.onclick=()=>sequenceModal(sequences.find(x=>x.id===b.dataset.editseq)));
 document.querySelectorAll('[data-delseq]').forEach(b=>b.onclick=()=>deleteRow('followup_sequences',b.dataset.delseq));
 if($('templatefilter'))$('templatefilter').oninput=e=>document.querySelectorAll('.template').forEach(t=>t.style.display=t.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');
 document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>applyTemplate(b.dataset.template));
 if($('settingsform'))$('settingsform').onsubmit=saveSettings;
}
function filterContacts(){let q=$('contactfilter').value.toLowerCase(),stage=$('stagefilter').value;document.querySelectorAll('#contactrows tr').forEach(r=>{let text=r.innerText.toLowerCase(),stageText=r.cells[5]?.innerText||'';r.style.display=text.includes(q)&&(!stage||stageText===stage)?'':'none'})}
function contactModal(c={}){
 modal(c.id?'Edit contact':'Add contact',`<form id="contactform"><div class="formgrid">${formField('Full name','cname',c.full_name||'','text',true)}${formField('Email','cemail',c.email||'','email')}${formField('Phone','cphone',c.phone||'')}${formField('Company','ccompany',c.company||'')}${formField('Lead source','csource',c.lead_source||'') }<div class="field"><label>Lead stage</label><select id="cstage">${['New','Contacted','Qualified','Proposal','Won','Lost'].map(x=>`<option ${((c.lead_stage||'New')===x)?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Consent status</label><select id="cconsent">${['unknown','opted_in','opted_out'].map(x=>`<option ${(c.consent_status||'unknown')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Notes</label><textarea id="cnotes">${esc(c.notes||'')}</textarea></div></div><button class="btn">Save contact</button></form>`);
 $('contactform').onsubmit=async e=>{e.preventDefault();try{await saveRow('contacts',{full_name:$('cname').value.trim(),email:$('cemail').value.trim()||null,phone:$('cphone').value.trim()||null,company:$('ccompany').value.trim()||null,lead_source:$('csource').value.trim()||null,lead_stage:$('cstage').value,consent_status:$('cconsent').value,notes:$('cnotes').value,custom_fields:c.custom_fields||{}},c.id)}catch(x){notify(errText(x))}}
}
function appointmentModal(a={}){
 const local=v=>v?new Date(v).toISOString().slice(0,16):'';
 modal(a.id?'Edit appointment':'Add appointment',`<form id="apptform"><div class="field"><label>Title *</label><input id="atitle" required value="${esc(a.title||'')}"></div><div class="field"><label>Contact</label><select id="acontact"><option value="">No linked contact</option>${contacts.map(c=>`<option value="${c.id}" ${a.contact_id===c.id?'selected':''}>${esc(c.full_name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Starts at *</label><input id="astart" type="datetime-local" required value="${local(a.starts_at)}"></div><div class="field"><label>Ends at *</label><input id="aend" type="datetime-local" required value="${local(a.ends_at)}"></div></div><div class="field"><label>Status</label><select id="astatus">${['scheduled','confirmed','completed','cancelled','no_show'].map(x=>`<option ${(a.status||'scheduled')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea id="anotes">${esc(a.notes||'')}</textarea></div><button class="btn">Save appointment</button></form>`);
 $('apptform').onsubmit=async e=>{e.preventDefault();let start=new Date($('astart').value),end=new Date($('aend').value);if(end<=start){notify('End time must be after start time');return}try{await saveRow('appointments',{title:$('atitle').value.trim(),contact_id:$('acontact').value||null,starts_at:start.toISOString(),ends_at:end.toISOString(),status:$('astatus').value,notes:$('anotes').value},a.id)}catch(x){notify(errText(x))}}
}
function ruleModal(r={}){
 modal(r.id?'Edit automation rule':'New automation rule',`<form id="ruleform"><div class="field"><label>Rule name *</label><input id="rname" required value="${esc(r.name||'')}"></div><div class="formgrid"><div class="field"><label>Trigger</label><select id="rtrigger">${['new_contact','lead_stage_changed','appointment_created','appointment_reminder','manual'].map(x=>`<option ${(r.trigger_type||'new_contact')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Action</label><select id="raction">${['create_task','draft_ai_reply','notify_owner','send_followup','create_appointment'].map(x=>`<option ${(r.action_type||'notify_owner')===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Enabled</label><select id="renabled"><option value="false" ${r.is_enabled?'':'selected'}>No</option><option value="true" ${r.is_enabled?'selected':''}>Yes</option></select></div><div class="field"><label>Configuration JSON</label><textarea id="rconfig">${esc(JSON.stringify(r.config||{},null,2))}</textarea></div><button class="btn">Save rule</button></form>`);
 $('ruleform').onsubmit=async e=>{e.preventDefault();let config;try{config=JSON.parse($('rconfig').value||'{}')}catch{notify('Configuration must be valid JSON');return}try{await saveRow('automation_rules',{name:$('rname').value.trim(),trigger_type:$('rtrigger').value,action_type:$('raction').value,is_enabled:$('renabled').value==='true',config},r.id)}catch(x){notify(errText(x))}}
}
function sequenceModal(s={}){
 modal(s.id?'Edit follow-up sequence':'New follow-up sequence',`<form id="seqform"><div class="field"><label>Sequence name *</label><input id="sname" required value="${esc(s.name||'')}"></div><div class="field"><label>Channel</label><select id="schannel">${['email','sms','whatsapp'].map(x=>`<option ${(s.channel||'email')===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Steps JSON</label><textarea id="ssteps">${esc(JSON.stringify(s.steps||[{delay_hours:0,template:'Welcome message draft'}],null,2))}</textarea></div><div class="field"><label>Enabled</label><select id="senabled"><option value="false" ${s.is_enabled?'':'selected'}>No</option><option value="true" ${s.is_enabled?'selected':''}>Yes</option></select></div><div class="notice">This saves a sequence definition only. It does not send messages.</div><button class="btn">Save sequence</button></form>`);
 $('seqform').onsubmit=async e=>{e.preventDefault();let steps;try{steps=JSON.parse($('ssteps').value||'[]');if(!Array.isArray(steps))throw Error()}catch{notify('Steps must be a valid JSON array');return}try{await saveRow('followup_sequences',{name:$('sname').value.trim(),channel:$('schannel').value,steps,is_enabled:$('senabled').value==='true'},s.id)}catch(x){notify(errText(x))}}
}
async function saveSettings(e){e.preventDefault();let payload={workspace_id:workspaceId,business_name:$('businessname').value.trim()||null,website:$('website').value.trim()||null,category:$('category').value||null,timezone:$('timezone').value.trim()||'UTC',description:$('description').value,selected_template:$('category').value||null,settings:businessSettings.settings||{},updated_at:new Date().toISOString()};let {error}=await supabaseClient.from('business_settings').upsert(payload,{onConflict:'workspace_id'});if(error){notify(errText(error));return}await loadAll();render();notify('Business settings saved')}
async function applyTemplate(category){let {error}=await supabaseClient.from('business_settings').upsert({workspace_id:workspaceId,business_name:businessSettings.business_name||null,website:businessSettings.website||null,category,timezone:businessSettings.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',description:businessSettings.description||null,selected_template:category,settings:businessSettings.settings||{},updated_at:new Date().toISOString()},{onConflict:'workspace_id'});if(error){notify(errText(error));return}await loadAll();notify(category+' template applied to business profile')}
$('menu-btn').onclick=()=>$('sidebar').classList.toggle('open');
(async()=>{let {data,error}=await supabaseClient.auth.getSession();if(error){$('auth-message').textContent=errText(error);return}await startSession(data.session)})();
</script>
</body></html>
